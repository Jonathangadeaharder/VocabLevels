[project]
name = "vocab-levels"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deep-translator>=1.11.4",
    "wordfreq>=3.1.1",
    "stanza>=1.10",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "tiktoken>=0.13.0",
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-branch --cov-report=term-missing --cov-fail-under=86"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
    "english/*",
    "german/*",
    "spanish/*",
    "arabic/*",
    "french/*",
    "swedish/*",
    "chinese/*",
    "dutch/*",
    "docs/*",
    "openspec/*",
    "generate_dutch_vocab.py",
    # One-time migration script; needs ~2GB stanza models for full coverage.
    "fix_pos_and_overflow.py",
    # One-time checkpoint flusher with hard-wired ROOT/state dirs.
    "work/flush_checkpoints.py",
    # CLI entry modules exercised via subprocess, not unit-tested.
    "scripts/gemma_qa/__main__.py",
    "scripts/gemma_qa/build_audit_sample.py",
    "scripts/gemma_qa/cli.py",
    "scripts/expand_concepts.py",
]



[tool.coverage.report]
fail_under = 86
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests: fixtures are requested for side effects (tmp_repo chdir) and mock
# signatures mirror the interfaces they replace, so "unused" args are intended.
"tests/*" = ["ARG"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
