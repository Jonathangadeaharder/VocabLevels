name: SonarQube
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  # Keyed by head SHA: a run for a superseded SHA can never cancel the
  # current head's in-flight scan; only same-SHA reruns cancel each other.
  # The repository scope keeps identically named fork branches separate.
  group: sonarqube-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  # Required to download the coverage artifact from the CI run.
  actions: read

jobs:
  sonar:
    name: SonarQube Analysis
    # pull_request never receives secrets for dependabot PRs, so the scan
    # runs from the completed CI workflow, which always has secret access
    # (issue #159); forks and red CI runs are excluded from scanning.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    # SonarQube Community Build analyzes the main branch only (no branch or
    # pull request analysis), so no sonar.pullrequest.* / sonar.branch.*
    # parameters are passed: every scan lands on the main-branch analysis.
    timeout-minutes: 30
    steps:
      # workflow_run check runs attach to the default-branch commit, so the
      # required check must be reported on the scanned head SHA explicitly
      # via the Checks API (#172).
      - name: Mark SonarQube Analysis in progress on the scanned commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          close_stale_check_runs() {
            gh api --method GET --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[]
                | select(.name == "SonarQube Analysis" and .status == "in_progress")
                | .id' \
              | while read -r stale_id; do
                  echo "::warning::closing stale in_progress check run $stale_id"
                  gh api --method PATCH "repos/$REPO/check-runs/$stale_id" \
                    -f status=completed \
                    -f conclusion=cancelled || true
                done
          }
          close_stale_check_runs
          if ID=$(gh api --method POST "repos/$REPO/check-runs" \
            -f head_sha="$HEAD_SHA" \
            -f name="SonarQube Analysis" \
            -f status=in_progress \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq .id); then
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::check-run creation failed; the report step will create it"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # The scanned branch's tree is untrusted and never executed in
          # this job (#167); do not leave the checks:write token readable
          # from the local git config either (#172).
          persist-credentials: false
      - name: Pin scanner config to main
        # The scanner must be driven only by this pinned config from main,
        # never by PR-supplied properties: a PR could point sonar.sources
        # outside the workspace and upload arbitrary runner files.
        shell: bash
        run: |
          set -euo pipefail
          # rm -rf unlinks symlinks without following them: a PR that
          # commits this file as a symlink must not have the redirect
          # clobber the link's target, and a directory at this path is
          # removed too (rm -f would fail and abort the pin step).
          rm -rf sonar-project.properties
          if git cat-file -e "origin/main:sonar-project.properties"; then
            git show "origin/main:sonar-project.properties" > sonar-project.properties
          else
            echo "::error::sonar-project.properties is missing from origin/main; refusing to fall back to the untrusted PR-supplied config."
            exit 1
          fi
      - name: Reject symlinks escaping the workspace
        # SonarScanner follows symlinks under sonar.sources=.; a PR
        # symlink resolving outside the workspace would exfiltrate
        # runner files to the SonarQube server even though the tree is
        # never executed. Trusted stdlib python3 only, never repo code.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          root = os.path.realpath(os.getcwd())
          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout.decode("utf-8")
          escaping = [
              path
              for path in tracked.split("\0")
              if path
              and os.path.islink(path)
              and os.path.realpath(path) != root
              and not os.path.realpath(path).startswith(root + os.sep)
          ]
          if escaping:
              print(f"::error::symlink(s) resolve outside the workspace: {escaping}")
              sys.exit(1)
          PY
      - name: Download coverage report from the CI run
        # Only the unprivileged CI job may run tests, so the coverage report
        # is pulled from the triggering CI run's artifact instead of ever
        # executing the tree here (#167). The name must match ci.yml's upload.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # rm never follows symlinks: a PR committing coverage-report or
          # coverage.xml as a symlink must not redirect writes outside
          # the workspace.
          rm -rf coverage-report coverage.xml
          # gh run download extracts the archive before any local check
          # can run, so refuse oversized artifacts by API size first.
          SIZE=$(gh api "repos/$REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "coverage") | .size_in_bytes' \
            | head -1)
          if [ -z "$SIZE" ]; then
            echo "::error::coverage artifact not found in CI run $CI_RUN_ID"
            exit 1
          fi
          if [ "$SIZE" -gt $((256 * 1024 * 1024)) ]; then
            echo "::error::coverage artifact too large ($SIZE bytes)"
            exit 1
          fi
          gh run download "$CI_RUN_ID" -R "$REPO" -n coverage -D coverage-report
          mv coverage-report/coverage.xml coverage.xml
          # Extracted files are untracked, unchecked and inside
          # sonar.sources=.: discard the staging directory once the
          # report is out.
          rm -rf coverage-report
      - name: Validate coverage report from the CI run
        # pull_request CI runs execute the PR's own ci.yml, so the
        # artifact is untrusted input to this token-bearing job: reject
        # anything that is not a regular, well-formed report whose
        # paths stay inside the workspace. Stdlib python3 only (#167).
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = os.path.realpath(os.getcwd())
          report = "coverage.xml"
          if os.path.islink(report) or not os.path.isfile(report):
              print(f"::error::{report} must be a regular file, not a symlink")
              sys.exit(1)
          if os.path.getsize(report) > 256 * 1024 * 1024:
              print(f"::error::{report} exceeds 256 MiB")
              sys.exit(1)
          data = open(report, "rb").read()
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              print("::error::coverage.xml must be UTF-8 encoded")
              sys.exit(1)
          if "<!DOCTYPE" in text or "<!ENTITY" in text:
              print("::error::coverage.xml must not contain DTD or entity declarations")
              sys.exit(1)
          parsed = ET.fromstring(data)
          for source in parsed.findall("./sources/source"):
              text = (source.text or "").strip()
              base = text if os.path.isabs(text) else os.path.join(root, text)
              real = os.path.realpath(base)
              if real != root and not real.startswith(root + os.sep):
                  print(f"::error::coverage source {text!r} escapes the workspace")
                  sys.exit(1)
          for cls in parsed.iter("class"):
              name = cls.get("filename", "")
              if os.path.isabs(name) or ".." in name.split("/"):
                  print(f"::error::coverage file path {name!r} escapes the workspace")
                  sys.exit(1)
              if not os.path.isfile(os.path.join(root, name)):
                  print(f"::error::coverage file path {name!r} does not exist in the scanned tree")
                  sys.exit(1)
          PY
      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 36); do
            STATUS=$(curl -sf --max-time 2 http://127.0.0.1:9001/api/system/status | sed -n 's/.*"status":"\([^"]*\)".*/\1/p' || true)
            echo "Sonar status: ${STATUS:-unreachable} ($i/36)"
            if [ "$STATUS" = "UP" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SonarQube at localhost:9001 never became UP"
          exit 1
      - name: SonarQube Scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          # Fail the workflow when the scan does not pass the quality gate.
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9001
      - name: Report SonarQube Analysis result on the scanned commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$SCAN_OUTCOME" in
            success)   CONCLUSION=success ;;
            cancelled)  CONCLUSION=cancelled ;;
            timed_out)  CONCLUSION=timed_out ;;
            *)          CONCLUSION=failure ;;
          esac
          create_completed_check_run() {
            gh api --method POST "repos/$REPO/check-runs" \
              -f head_sha="$HEAD_SHA" \
              -f name="SonarQube Analysis" \
              -f status=completed \
              -f conclusion="$CONCLUSION" \
              -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          close_stale_check_runs() {
            gh api --method GET --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[]
                | select(.name == "SonarQube Analysis" and .status == "in_progress")
                | .id' \
              | while read -r stale_id; do
                  echo "::warning::closing stale in_progress check run $stale_id"
                  gh api --method PATCH "repos/$REPO/check-runs/$stale_id" \
                    -f status=completed \
                    -f conclusion=cancelled || true
                done
          }
          if [ -n "$CHECK_ID" ]; then
            ok=0
            for attempt in 1 2; do
              if gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" \
                -f status=completed \
                -f conclusion="$CONCLUSION"; then
                ok=1
                break
              fi
              echo "::warning::PATCH attempt $attempt on check run $CHECK_ID failed"
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              close_stale_check_runs
              create_completed_check_run
            fi
          else
            close_stale_check_runs
            create_completed_check_run
          fi
